# Nginx reverse proxy for DocVault: two hostnames, one app.
# Replace the server_name values with the real hostnames, then run `certbot --nginx` for HTTPS.

# ---- Student portal (give this address to students) --------------------------------------
server {
    listen 80;
    server_name assignments.college.edu;

    # Match DOCWALL_MAX_UPLOAD_MB (base64 adds ~35%)
    client_max_body_size 40m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- Teacher portal (teacher login, student login, student preview) ----------------------
server {
    listen 80;
    server_name staff.college.edu;

    client_max_body_size 40m;

    # Optional: only reachable from the campus network
    # allow 10.0.0.0/8;
    # deny  all;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
