<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher · DocWall</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard" style="text-decoration:none">
        <div class="brand-mark" style="background:linear-gradient(135deg,#7c3aed,#2563eb)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/></svg></div>
        <div><div class="brand-name">Doc<span style="color:#a78bfa">Wall</span></div><span class="brand-badge teacher">Teacher portal</span></div>
      </a>
      <a class="btn btn-primary cta" href="#/assignments/new" id="new-cta"></a>
      <div class="nav-label">Overview</div>
      <a class="nav-item" href="#/dashboard" data-nav="dashboard"></a>
      <a class="nav-item" href="#/assignments" data-nav="assignments"></a>
      <a class="nav-item" href="#/grading" data-nav="grading"></a>
      <div class="nav-label">People</div>
      <a class="nav-item" href="#/students" data-nav="students"></a>
      <a class="nav-item" href="#/teachers" data-nav="teachers"></a>
      <a class="nav-item" href="#/student-view" data-nav="preview"></a>
      <div class="nav-label">Account</div>
      <a class="nav-item" href="#/settings" data-nav="settings"></a>
      <a class="nav-item" href="#/profile" data-nav="profile"></a>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar" id="sb-avatar" style="background:linear-gradient(135deg,#7c3aed,#2563eb)"></div>
          <div class="min0"><div class="name" id="sb-name"></div><div class="meta" id="sb-meta"></div></div>
          <button class="icon-btn-dark" id="logout" title="Sign out"></button>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="Menu"></button>
        <div class="search"><input id="search" placeholder="Search assignments or students…"><span id="search-ico"></span></div>
        <div class="spacer"></div>
        <div class="avatar" id="tb-avatar" style="background:linear-gradient(135deg,#7c3aed,#2563eb)"></div>
      </header>
      <main class="content" id="view"><div class="loading">Loading…</div></main>
    </div>
  </div>
  <script src="/js/ui.js"></script>
  <script src="/js/teacher.js"></script>
</body>
</html>
